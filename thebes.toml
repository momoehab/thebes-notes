# thebes.toml — note-mo's deploy manifest.
#
# Generated by `thebes-deploy new`. One file describes the deploy:
# network, smart contracts, build commands, identities. `thebes-deploy
# deploy` reads this; builds; signs; installs; uploads; verifies.

[project]
name = "note-mo"
default_network = "wan-experimental"
chain_id = 2026

[networks.wan-experimental]
# One stable public name resolves the whole validator set behind the
# boundary — never put validator IPs here.
gateway = "https://memphis.mercaturaforum.com"
routing = "smart"

[canisters.backend]
type = "backend-motoko"
cid = 176438213872974
# `mops install` is a no-op once packages are present; `mops sources`
# expands to the --package flags moc needs. `mkdir -p` because moc
# does not create the output directory itself.
# `--legacy-persistence` is the persistence model this platform
# implements: an upgrade runs pre_upgrade, carries STABLE memory to a
# fresh instance, and runs post_upgrade, which is exactly what this
# mode compiles for. Your `var`s survive `deploy --upgrade`.
# moc's default (enhanced orthogonal persistence) keeps state in MAIN
# memory and needs the replica to retain it across an upgrade; this
# platform does not do that, so an EOP build comes back up blank.
# Keep this flag. `thebes-deploy deploy --upgrade` refuses an upgrade
# that would drop your state, so removing it fails loudly, not quietly.
build = "mops install && mkdir -p build && moc --legacy-persistence $(mops sources) -o build/backend.wasm backend/Backend.mo"
wasm = "build/backend.wasm"

[canisters.frontend]
type = "frontend"
cid = 101422224289810
wasm = "frontend/asset_canister.wasm"
build = "cd frontend && npm install && npm run build"
bundle = "frontend/dist"
health_check_url = "/index.html"
